services:
  postgres:
    image: postgres:16-alpine
    container_name: leapto-portfolio-db
    environment:
      POSTGRES_USER: leapto
      POSTGRES_PASSWORD: leapto
      POSTGRES_DB: leapto_portfolio
    ports:
      - "5433:5432"
    volumes:
      - leapto_portfolio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leapto -d leapto_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leapto_portfolio_pg:
